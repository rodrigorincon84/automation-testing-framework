[project]
name = "automation-testing-framework"
version = "0.1.0"
description = "Testing framework that allows to execute both UI and API scenarios"
authors = [
    {name = "Rodrigo Rincon"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright (>=1.59.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "selenium (>=4.43.0,<5.0.0)",
    "pytest-bdd (>=8.1.0,<9.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "faker (>=40.15.0,<41.0.0)",
    "assertpy (>=1.1,<2.0)",
    "pyvirtualdisplay (>=3.0,<4.0)",
    "pyprojroot (>=0.3.0,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
